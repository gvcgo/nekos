[package]
name = "nekos"
version = "0.1.0"
description = "Tauri orchestrator for the nekos sing-box client"
edition = "2021"

[lib]
name = "nekos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Enables the custom-protocol scheme used for production builds (embedded frontend assets).
# Disabled by default so `tauri dev` can use the devUrl server.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "blocking", "json"] }
getrandom = "0.2"
parking_lot = "0.12"
tokio = { version = "1", features = ["time"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-clipboard-manager = "2.3.3"

# Vendored tao 0.36.0 (as 0.35.99) until tauri >= 2.12 ships tao ^0.36 —
# see vendor/tao/Cargo.toml header. Drop when upgrading past that.
[patch.crates-io]
tao = { path = "vendor/tao" }
