[package]
name = "nekos"
version = "0.1.0"
description = "Tauri orchestrator for the nekos sing-box client"
edition = "2021"

[lib]
name = "nekos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
